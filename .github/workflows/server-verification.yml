name: Server verification
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: inert-ci-fixture
          POSTGRES_DB: feuer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d feuer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@feuer/server
      - run: npm run test:server
        env:
          FEUER_DB_CONNECTION_STRING: postgresql://fixture:inert-ci-fixture@127.0.0.1:5432/feuer_test
